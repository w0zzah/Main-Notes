<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Signal &amp; Switch — Networking Problem Drills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<style>
  :root{
    --bg: #101820;
    --panel: #172230;
    --panel-alt: #1d2b3a;
    --border: #2a3b4d;
    --text: #e7eef5;
    --text-dim: #8ca0b3;
    --cyan: #4fd1c5;
    --amber: #f2b134;
    --success: #4fd17a;
    --danger: #f2665b;
    --radius: 10px;
  }
  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    line-height: 1.5;
  }
  code, pre, textarea, .mono{
    font-family: 'IBM Plex Mono', monospace;
  }

  header{
    position: relative;
    padding: 28px clamp(16px, 4vw, 48px) 20px;
    border-bottom: 1px solid var(--border);
    overflow: hidden;
  }
  header svg.pulse{
    position: absolute;
    top: 0; left: 0; right: 0;
    width: 100%; height: 100%;
    opacity: 0.22;
    pointer-events: none;
  }
  .header-inner{
    position: relative;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
  }
  .brand h1{
    margin: 0 0 4px;
    font-size: clamp(20px, 3vw, 28px);
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .brand p{
    margin: 0;
    color: var(--text-dim);
    font-size: 14px;
    max-width: 48ch;
  }
  .brand .accent{ color: var(--cyan); }

  nav.pager{
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .pager-count{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    min-width: 52px;
    text-align: center;
  }
  button.nav-btn{
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s, color .15s, transform .1s;
  }
  button.nav-btn:hover{ border-color: var(--cyan); color: var(--cyan); }
  button.nav-btn:active{ transform: scale(0.94); }
  button.nav-btn:disabled{ opacity: .35; cursor: not-allowed; }

  .dots{
    display:flex; gap:6px; padding: 12px clamp(16px, 4vw, 48px) 0;
    flex-wrap: wrap;
  }
  .dot{
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--border);
    border: none; padding: 0; cursor: pointer;
  }
  .dot.active{ background: var(--cyan); transform: scale(1.3); }
  .dot.solved{ background: var(--success); }

  main{
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px clamp(16px, 4vw, 48px) 60px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  @media (max-width: 880px){
    main{ grid-template-columns: 1fr; }
  }

  .panel{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
  }

  .qid{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--amber);
    letter-spacing: 0.02em;
  }
  h2.qtitle{
    margin: 4px 0 12px;
    font-size: 21px;
    font-weight: 600;
  }
  .qprompt{
    color: var(--text-dim);
    font-size: 14.5px;
    margin-bottom: 18px;
  }

  table.params{
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.params caption{
    text-align: left;
    color: var(--text-dim);
    font-size: 12.5px;
    margin-bottom: 8px;
  }
  table.params th, table.params td{
    text-align: left;
    padding: 7px 8px;
    border-bottom: 1px solid var(--border);
  }
  table.params th{ color: var(--text-dim); font-weight: 500; }
  table.params td.pname{ color: var(--cyan); }

  .editor-wrap{
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: #0b1219;
  }
  .editor-bar{
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px;
    background: var(--panel-alt);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-dim);
  }
  textarea#editor{
    width: 100%;
    min-height: 220px;
    resize: vertical;
    background: transparent;
    color: var(--text);
    border: none;
    outline: none;
    padding: 14px;
    font-size: 13.5px;
    line-height: 1.55;
    tab-size: 4;
  }

  .actions{
    display: flex;
    gap: 10px;
    margin-top: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  button.action{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: filter .15s, transform .1s, opacity .15s;
  }
  button.action:active{ transform: scale(0.98); }
  button.action:disabled{ opacity: .45; cursor: not-allowed; }
  .btn-run{ background: var(--cyan); color: #06231f; }
  .btn-run:hover:not(:disabled){ filter: brightness(1.08); }
  .btn-reveal{ background: transparent; color: var(--amber); border-color: var(--amber); }
  .btn-reveal:hover{ background: rgba(242,177,52,0.1); }
  .btn-reset{ background: transparent; color: var(--text-dim); border-color: var(--border); }
  .btn-reset:hover{ color: var(--text); border-color: var(--text-dim); }

  .py-status{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .py-status .led{
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--amber);
  }
  .py-status.ready .led{ background: var(--success); }

  #results{ margin-top: 18px; }
  .summary-line{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13.5px;
    margin-bottom: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .summary-line.all-pass{ border-color: var(--success); color: var(--success); background: rgba(79,209,122,0.08); }
  .summary-line.some-fail{ border-color: var(--danger); color: var(--danger); background: rgba(242,102,91,0.08); }

  .case{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 9px 10px;
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: 20px 1fr;
    gap: 8px;
    align-items: start;
  }
  .case:last-child{ border-bottom: none; }
  .case .mark{ font-weight: 700; }
  .case.pass .mark{ color: var(--success); }
  .case.fail .mark{ color: var(--danger); }
  .case .row-label{ color: var(--text-dim); }

  details#reveal{
    margin-top: 18px;
  }
  details#reveal > summary{ display: none; }
  pre.answer{
    background: #0b1219;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-size: 13px;
    overflow-x: auto;
    color: #cfe8e4;
    white-space: pre;
  }
  .reveal-label{
    font-size: 12px;
    color: var(--amber);
    margin: 0 0 8px;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>

<header>
  <svg class="pulse" viewBox="0 0 1200 140" preserveAspectRatio="none">
    <polyline points="0,70 120,70 150,20 180,120 210,70 900,70 930,30 955,110 985,70 1200,70"
      fill="none" stroke="#4fd1c5" stroke-width="2"/>
  </svg>
  <div class="header-inner">
    <div class="brand">
      <h1>Signal &amp; <span class="accent">Switch</span></h1>
      <p>Nine networking calculations, written and checked in Python. Run your function against the test cases, or reveal the reference solution.</p>
    </div>
    <nav class="pager">
      <button class="nav-btn" id="prevBtn" aria-label="Previous question">&#8592;</button>
      <span class="pager-count" id="pagerCount">1 / 9</span>
      <button class="nav-btn" id="nextBtn" aria-label="Next question">&#8594;</button>
    </nav>
  </div>
</header>

<div class="dots" id="dots"></div>

<main>
  <section class="panel" id="problemPanel">
    <div class="qid" id="qid"></div>
    <h2 class="qtitle" id="qtitle"></h2>
    <p class="qprompt" id="qprompt"></p>
    <table class="params" id="paramsTable">
      <caption>Parameters</caption>
      <thead><tr><th>Name</th><th>Meaning</th></tr></thead>
      <tbody id="paramsBody"></tbody>
    </table>
  </section>

  <section class="panel" id="editorPanel">
    <div class="editor-wrap">
      <div class="editor-bar">
        <span id="editorFnName" class="mono"></span>
        <span>Python</span>
      </div>
      <textarea id="editor" spellcheck="false"></textarea>
    </div>

    <div class="actions">
      <button class="action btn-run" id="runBtn" disabled>Run tests</button>
      <button class="action btn-reveal" id="revealBtn">Reveal answer</button>
      <button class="action btn-reset" id="resetBtn">Reset code</button>
      <span class="py-status" id="pyStatus"><span class="led"></span><span id="pyStatusText">Loading Python runtime…</span></span>
    </div>

    <div id="results"></div>

    <details id="reveal">
      <summary></summary>
      <p class="reveal-label">Reference solution (Python)</p>
      <pre class="answer" id="answerCode"></pre>
    </details>
  </section>
</main>

<script>
/* ---------- question bank ---------- */
/* referenceBody: the correct implementation, indented 4 spaces, params matching `params` names */
const questions = [
  {
    id: 'connection_setup_delay',
    title: 'Connection setup delay',
    prompt: 'Calculate the total time to set up a network connection: a request travels forward across every switch, and a response travels back. Account for propagation, transmission, and per-switch processing delay on both legs.',
    params: [
      ['num_switches', 'Number of switches on the path (count)'],
      ['cable_length_km', 'Cable length (km)'],
      ['light_speed_kmps', 'Propagation speed in the cable (km/s)'],
      ['data_rate_bps', 'Data rate (bits/s)'],
      ['request_length_b', 'Request packet length (bits)'],
      ['response_length_b', 'Response packet length (bits)'],
      ['processing_time_s', 'Processing time per switch (s)']
    ],
    stub: `def connection_setup_delay(num_switches, cable_length_km, light_speed_kmps, data_rate_bps, request_length_b, response_length_b, processing_time_s):
    # your code here
    pass`,
    referenceBody:
`    n = num_switches + 1
    tp = cable_length_km / light_speed_kmps
    tx_req = request_length_b / data_rate_bps
    tx_resp = response_length_b / data_rate_bps
    forward = n * (tp + tx_req) + (n * processing_time_s)
    back = n * (tp + tx_resp) + (n * processing_time_s)
    return forward + back`,
    tests: [
      [2, 100, 200000, 1e6, 1000, 5000, 0.001],
      [0, 50, 250000, 2e6, 500, 500, 0],
      [5, 1000, 200000, 1e8, 8000, 8000, 0.0005]
    ],
    answer: `def connection_setup_delay(num_switches, cable_length_km, light_speed_kmps,
                            data_rate_bps, request_length_b, response_length_b,
                            processing_time_s):
    n      = num_switches
    k      = cable_length_km
    c      = light_speed_kmps
    r      = data_rate_bps
    m_req  = request_length_b
    m_resp = response_length_b
    p      = processing_time_s
    n = n + 1
    tp = k / c
    tx_req = m_req / r
    tx_resp = m_resp / r
    forward = n * (tp + tx_req) + (n * p)
    back = n * (tp + tx_resp) + (n * p)
    total = forward + back
    return total`
  },
  {
    id: 'number_fragments',
    title: 'Number of fragments',
    prompt: 'Determine how many fragments (packets) are needed to send a message, given the message size, the per-packet overhead, and the maximum packet size.',
    params: [
      ['message_size_bytes', 'Total message size (bytes)'],
      ['overhead_per_packet_bytes', 'Header/overhead per packet (bytes)'],
      ['maximum_packet_size_bytes', 'Maximum packet size (bytes)']
    ],
    stub: `def number_fragments(message_size_bytes, overhead_per_packet_bytes, maximum_packet_size_bytes):
    # your code here
    pass`,
    referenceBody:
`    return math.ceil(message_size_bytes / (maximum_packet_size_bytes - overhead_per_packet_bytes))`,
    tests: [
      [5000, 20, 500],
      [1000, 40, 200],
      [64, 8, 16]
    ],
    answer: `import math

def number_fragments(message_size_bytes, overhead_per_packet_bytes, maximum_packet_size_bytes):
    s = message_size_bytes
    o = overhead_per_packet_bytes
    m = maximum_packet_size_bytes
    return math.ceil(s / (m - o))`
  },
  {
    id: 'last_fragment_size',
    title: 'Last fragment size',
    prompt: 'Calculate the exact size, including overhead, of the final fragment when a message is split into fixed-size packets.',
    params: [
      ['message_size_bytes', 'Total message size (bytes)'],
      ['overhead_per_packet_bytes', 'Header/overhead per packet (bytes)'],
      ['maximum_packet_size_bytes', 'Maximum packet size (bytes)']
    ],
    stub: `def last_fragment_size(message_size_bytes, overhead_per_packet_bytes, maximum_packet_size_bytes):
    # your code here
    pass`,
    referenceBody:
`    payload = maximum_packet_size_bytes - overhead_per_packet_bytes
    return ((message_size_bytes - 1) % payload + 1) + overhead_per_packet_bytes`,
    tests: [
      [5000, 20, 500],
      [1000, 40, 200],
      [64, 8, 16]
    ],
    answer: `def last_fragment_size(message_size_bytes, overhead_per_packet_bytes, maximum_packet_size_bytes):
    s = message_size_bytes
    o = overhead_per_packet_bytes
    m = maximum_packet_size_bytes
    payload = m - o
    return ((s - 1) % payload + 1) + o`
  },
  {
    id: 'value_from_db',
    title: 'Value from decibels',
    prompt: 'Convert a decibel (dB) value back into its corresponding linear signal or power ratio.',
    params: [
      ['db_value', 'Value in decibels (dB)']
    ],
    stub: `def value_from_db(db_value):
    # your code here
    pass`,
    referenceBody:
`    return 10 ** (db_value / 10)`,
    tests: [
      [0],
      [10],
      [20],
      [3],
      [-3]
    ],
    answer: `def value_from_db(db_value):
    return 10 ** (db_value / 10)`
  },
  {
    id: 'p_persistent_csma_collision_probability',
    title: 'p-persistent CSMA: collision probability',
    prompt: 'Compute the probability of a collision in a p-persistent CSMA network, given the per-slot transmission probability p.',
    params: [
      ['p', 'Transmission probability per slot (0–1)']
    ],
    stub: `def p_persistent_csma_collision_probability(p):
    # your code here
    pass`,
    referenceBody:
`    return p / (2 - p)`,
    tests: [
      [0.1],
      [0.3],
      [0.5],
      [0.9]
    ],
    answer: `def p_persistent_csma_collision_probability(p):
    return p / (2 - p)`
  },
  {
    id: 'p_persistent_csma_access_delay',
    title: 'p-persistent CSMA: access delay',
    prompt: 'Determine the expected access delay, in slots, for a station waiting to transmit in a p-persistent CSMA network.',
    params: [
      ['p', 'Transmission probability per slot (0–1)']
    ],
    stub: `def p_persistent_csma_access_delay(p):
    # your code here
    pass`,
    referenceBody:
`    return (1 - p) / p`,
    tests: [
      [0.1],
      [0.25],
      [0.5],
      [0.8]
    ],
    answer: `def p_persistent_csma_access_delay(p):
    return (1 - p) / p`
  },
  {
    id: 'number_fdma_channels',
    title: 'Number of FDMA channels',
    prompt: 'Calculate the maximum number of FDMA channels that fit in a given total bandwidth, accounting for the guard band and the bandwidth needed per user channel.',
    params: [
      ['b_hz', 'Total available bandwidth (Hz)'],
      ['g_hz', 'Guard band between channels (Hz)'],
      ['u_hz', 'Bandwidth required per user channel (Hz)']
    ],
    stub: `def number_fdma_channels(b_hz, g_hz, u_hz):
    # your code here
    pass`,
    referenceBody:
`    return math.ceil(b_hz / (u_hz + g_hz)) - 1`,
    tests: [
      [1000000, 10000, 40000],
      [500000, 5000, 20000],
      [2000000, 20000, 80000]
    ],
    answer: `def number_fdma_channels(b_hz, g_hz, u_hz):
    return math.ceil(b_hz / (u_hz + g_hz)) - 1`
  },
  {
    id: 'number_tdma_users',
    title: 'Number of TDMA users',
    prompt: 'Compute the maximum number of TDMA users supported by a frame, given the frame duration, the guard time needed between transmissions, and the transmission time allocated per user.',
    params: [
      ['s_s', 'Frame duration / total slot size (s)'],
      ['g_s', 'Guard time between transmissions (s)'],
      ['u_s', 'Transmission time allocated per user (s)']
    ],
    stub: `def number_tdma_users(s_s, g_s, u_s):
    # your code here
    pass`,
    referenceBody:
`    return math.floor(s_s / (g_s + u_s))`,
    tests: [
      [0.01, 0.0001, 0.001],
      [1, 0.01, 0.05],
      [0.5, 0.005, 0.02]
    ],
    answer: `def number_tdma_users(s_s, g_s, u_s):
    return math.floor(s_s / (g_s + u_s))`
  },
  {
    id: 'packet_error_probability',
    title: 'Packet error probability',
    prompt: 'Calculate the probability that a packet is received with at least one bit error, given the packet length and the independent per-bit error probability.',
    params: [
      ['packet_length_b', 'Packet length (bits)'],
      ['bit_error_probability', 'Independent bit error probability (0–1)']
    ],
    stub: `def packet_error_probability(packet_length_b, bit_error_probability):
    # your code here
    pass`,
    referenceBody:
`    return 1 - ((1 - bit_error_probability) ** packet_length_b)`,
    tests: [
      [1000, 0.0001],
      [64, 0.01],
      [12000, 0.000001]
    ],
    answer: `def packet_error_probability(packet_length_b, bit_error_probability):
    b = packet_length_b
    p = bit_error_probability
    result = 1 - ((1 - p) ** b)
    return result`
  }
];

/* ---------- state ---------- */
let current = 0;
const userCode = {};
const solved = new Set();
questions.forEach(q => userCode[q.id] = q.stub);

/* ---------- dom refs ---------- */
const qid = document.getElementById('qid');
const qtitle = document.getElementById('qtitle');
const qprompt = document.getElementById('qprompt');
const paramsBody = document.getElementById('paramsBody');
const editor = document.getElementById('editor');
const editorFnName = document.getElementById('editorFnName');
const results = document.getElementById('results');
const reveal = document.getElementById('reveal');
const answerCode = document.getElementById('answerCode');
const pagerCount = document.getElementById('pagerCount');
const dotsWrap = document.getElementById('dots');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const runBtn = document.getElementById('runBtn');
const pyStatus = document.getElementById('pyStatus');
const pyStatusText = document.getElementById('pyStatusText');

/* ---------- build dots ---------- */
questions.forEach((q, i) => {
  const d = document.createElement('button');
  d.className = 'dot';
  d.setAttribute('aria-label', 'Go to question ' + (i + 1));
  d.addEventListener('click', () => { saveEditor(); current = i; render(); });
  dotsWrap.appendChild(d);
});

/* ---------- render ---------- */
function render() {
  const q = questions[current];
  qid.textContent = q.id;
  qtitle.textContent = q.title;
  qprompt.textContent = q.prompt;

  paramsBody.innerHTML = '';
  q.params.forEach(([name, desc]) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="pname">${name}</td><td>${desc}</td>`;
    paramsBody.appendChild(tr);
  });

  editorFnName.textContent = q.id + '(...)';
  editor.value = userCode[q.id];

  results.innerHTML = '';
  reveal.removeAttribute('open');
  answerCode.textContent = q.answer;

  pagerCount.textContent = `${current + 1} / ${questions.length}`;
  prevBtn.disabled = current === 0;
  nextBtn.disabled = current === questions.length - 1;

  [...dotsWrap.children].forEach((d, i) => {
    d.classList.toggle('active', i === current);
    d.classList.toggle('solved', solved.has(questions[i].id));
  });
}

function saveEditor() {
  userCode[questions[current].id] = editor.value;
}

/* ---------- navigation ---------- */
prevBtn.addEventListener('click', () => {
  if (current > 0) { saveEditor(); current--; render(); }
});
nextBtn.addEventListener('click', () => {
  if (current < questions.length - 1) { saveEditor(); current++; render(); }
});

/* ---------- editor: tab key inserts spaces ---------- */
editor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = editor.selectionStart, end = editor.selectionEnd;
    editor.value = editor.value.slice(0, start) + '    ' + editor.value.slice(end);
    editor.selectionStart = editor.selectionEnd = start + 4;
  }
});

/* ---------- formatting helpers ---------- */
function fmt(v) {
  if (v === null || v === undefined) return 'None';
  if (typeof v !== 'number') return String(v);
  if (Number.isInteger(v)) return String(v);
  return v.toPrecision(6).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Pyodide setup ---------- */
let pyodideInstance = null;
let pyodideReady = false;

async function initPyodide() {
  try {
    pyodideInstance = await loadPyodide();
    pyodideReady = true;
    runBtn.disabled = false;
    pyStatus.classList.add('ready');
    pyStatusText.textContent = 'Python ready';
  } catch (err) {
    pyStatusText.textContent = 'Python runtime failed to load';
  }
}
initPyodide();

/* ---------- run tests ---------- */
runBtn.addEventListener('click', async () => {
  if (!pyodideReady) return;
  const q = questions[current];
  saveEditor();
  const code = userCode[q.id];

  results.innerHTML = '<div class="summary-line">Running…</div>';
  runBtn.disabled = true;

  const paramList = q.params.map(p => p[0]).join(', ');
  const harness = `
import json, math

def _reference_impl(${paramList}):
${q.referenceBody}

_test_cases = json.loads(_test_cases_json)

${code}

_results = []
_all_pass = True
for _args in _test_cases:
    try:
        _expected = _reference_impl(*_args)
    except Exception as _e:
        _expected = None
    _got = None
    _error = None
    try:
        _got = ${q.id}(*_args)
    except NameError:
        _error = "no function named '${q.id}' was found"
    except Exception as _e:
        _error = str(_e)
    if _error is None and isinstance(_got, (int, float)) and not isinstance(_got, bool) and isinstance(_expected, (int, float)):
        _passed = abs(_got - _expected) <= max(1e-6 * max(abs(_got), abs(_expected)), 1e-6)
    else:
        _passed = False
    _all_pass = _all_pass and _passed
    _results.append({"args": _args, "expected": _expected, "got": _got, "error": _error, "passed": _passed})

json.dumps({"all_pass": _all_pass, "results": _results})
`;

  try {
    pyodideInstance.globals.set('_test_cases_json', JSON.stringify(q.tests));
    const outJson = await pyodideInstance.runPythonAsync(harness);
    const data = JSON.parse(outJson);
    renderResults(q, data);
    if (data.all_pass) solved.add(q.id); else solved.delete(q.id);
    [...dotsWrap.children][current].classList.toggle('solved', data.all_pass);
  } catch (err) {
    results.innerHTML = `<div class="summary-line some-fail">Your code raised an error before it could be tested:<br>${escapeHtml(err.message.split('\\n').slice(-3).join('\\n'))}</div>`;
  } finally {
    runBtn.disabled = false;
  }
});

function renderResults(q, data) {
  results.innerHTML = '';
  const passCount = data.results.filter(r => r.passed).length;
  const summary = document.createElement('div');
  summary.className = 'summary-line ' + (data.all_pass ? 'all-pass' : 'some-fail');
  summary.textContent = `${passCount} / ${data.results.length} tests passed`;
  results.appendChild(summary);

  data.results.forEach((r, idx) => {
    const div = document.createElement('div');
    div.className = 'case ' + (r.passed ? 'pass' : 'fail');
    const argsStr = r.args.map(fmt).join(', ');
    const gotStr = r.error ? `error: ${escapeHtml(r.error)}` : fmt(r.got);
    div.innerHTML = `<span class="mark">${r.passed ? '✓' : '✗'}</span>
      <span><span class="row-label">test ${idx + 1}</span> — input(${argsStr}) → expected ${fmt(r.expected)}, got ${gotStr}</span>`;
    results.appendChild(div);
  });
}

/* ---------- reveal answer ---------- */
document.getElementById('revealBtn').addEventListener('click', () => {
  reveal.open = !reveal.open;
});

/* ---------- reset code ---------- */
document.getElementById('resetBtn').addEventListener('click', () => {
  const q = questions[current];
  userCode[q.id] = q.stub;
  editor.value = q.stub;
  results.innerHTML = '';
});

render();
</script>
</body>
</html>
