<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Recap · Flash Cards</title>
<link rel="stylesheet" href="css.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body data-subject="biology">

<header>
  <div class="eyebrow">Daily Recap</div>
  <h1>Flash Cards</h1>
</header>

<div class="tabs" id="tabs"></div>

<div class="card-shell" id="cardShell">
  <div class="card-meta">
    <span class="label" id="cardLabel"></span>
    <div class="dots" id="dots"></div>
  </div>
  <p class="question" id="question"></p>
  <div class="options" id="options"></div>
  <div class="actions">
    <span class="feedback" id="feedback"></span>
    <button class="primary" id="actionBtn">Submit</button>
  </div>
</div>

<script>
const subjects = {
  COSC265: {
    name: 'COSC265',
    theme: { primary: '#2F6F4E', light: '#E3F0E4', dark: '#17301F' },
    cards: [
      { 
        q: 'A database intension is', 
        options: ['The state of a database', 'The data and all software (DBMS and applications) that process the database', 'The definition of the database', 'The description of how the database is used'], 
        answer: 'The definition of the database' 
      }
    ]
  },
  COSC264: {
    name: 'COSC264',
    theme: { primary: '#8B5E34', light: '#F3E9D8', dark: '#3E2A17' },
    cards: [
      { 
        q: 'When a TCP server executes an accept() call, what is returned upon success?', 
        options: ['A boolean True flag', 'The number of incoming bytes', 'A new socket dedicated to the client and the client\'s address', 'The original listening socket stream'], 
        answer: 'A new socket dedicated to the client and the client\'s address' 
      },
      { 
        q: 'Which socket type provides a connectionless, best-effort data transfer that preserves message boundaries?', 
        options: ['SOCK_STREAM', 'SOCK_DGRAM', 'SOCK_RAW', 'SOCK_SEQPACKET'], 
        answer: 'SOCK_DGRAM' 
      },
      { 
        q: 'In digital modulation, which technique encodes binary data by shifting the starting angle of the carrier wave while keeping amplitude and frequency constant?', 
        options: ['Amplitude Shift Keying (ASK)', 'Frequency Shift Keying (FSK)', 'Phase Shift Keying (PSK)', 'Manchester Encoding'], 
        answer: 'Phase Shift Keying (PSK)' 
      },
      { 
        q: 'Assume Pure ALOHA. If all packets have a transmission length of 3ms, what is the vulnerable period of one packet?', 
        options: ['1.5ms', '3ms', '6ms', '9ms'], 
        answer: '6ms' 
      },
      { 
        q: 'Why does Ethernet enforce a minimum payload size of 46 bytes?', 
        options: ['To ensure the frame is long enough for CSMA/CD collision detection signals to propagate across the network', 'To accommodate the standard IPv4 header size', 'To optimize router buffer allocation', 'Because 46 bytes is the maximum MTU for legacy hubs'], 
        answer: 'To ensure the frame is long enough for CSMA/CD collision detection signals to propagate across the network' 
      },
      { 
        q: 'A router receives an IP packet destined for 192.168.10.5. Its forwarding table has routes for 192.168.0.0/16 and 192.168.10.0/24. How will it route the packet?', 
        options: ['It drops the packet due to conflicting rules', 'It forwards it to the interface for 192.168.0.0/16 (Shortest Prefix Match)', 'It forwards it to the interface for 192.168.10.0/24 (Longest Prefix Match)', 'It broadcasts the packet to both interfaces'], 
        answer: 'It forwards it to the interface for 192.168.10.0/24 (Longest Prefix Match)' 
      },
      { 
        q: 'Why is IP fragmentation reassembly strictly performed at the final destination host rather than at intermediate routers?', 
        options: ['Routers lack the memory buffers and CPU cycles, and fragments may take entirely different paths through the network.', 'IPv4 does not support fragmentation headers.', 'The transport layer handles IP reassembly.', 'Link-layer error control prevents routers from reassembling frames.'], 
        answer: 'Routers lack the memory buffers and CPU cycles, and fragments may take entirely different paths through the network.' 
      }
    ]
  },
  SENG202: {
    name: 'SENG202',
    theme: { primary: '#3C3A8C', light: '#E7E6F5', dark: '#1D1B4E' },
    cards: [
      { 
        q: 'In Agile methodology, what is the primary purpose of a Daily Standup (Scrum)?', 
        options: ['To report status to management', 'To synchronize activities and create a plan for the next 24 hours', 'To write user stories', 'To review code commits'], 
        answer: 'To synchronize activities and create a plan for the next 24 hours' 
      }
    ]
  },
  ENCE260: {
    name: 'ENCE260',
    theme: { primary: '#C1502E', light: '#FBE7DD', dark: '#5B2213' },
    cards: [
      { 
        q: 'In the C programming language, what does the \'&\' operator do when placed directly before a variable (e.g., &myVar)?', 
        options: ['Dereferences the pointer', 'Performs a bitwise AND operation', 'Returns the memory address of the variable', 'Allocates dynamic memory'], 
        answer: 'Returns the memory address of the variable' 
      }
    ]
  }
};

const state = { subject: 'COSC264', index: 0, selected: null, submitted: false };

const tabsEl = document.getElementById('tabs');
const shellEl = document.getElementById('cardShell');
const labelEl = document.getElementById('cardLabel');
const dotsEl = document.getElementById('dots');
const questionEl = document.getElementById('question');
const optionsEl = document.getElementById('options');
const feedbackEl = document.getElementById('feedback');
const actionBtn = document.getElementById('actionBtn');

function applyTheme(key) {
  const t = subjects[key].theme;
  document.documentElement.style.setProperty('--primary', t.primary);
  document.documentElement.style.setProperty('--light', t.light);
  document.documentElement.style.setProperty('--dark', t.dark);
}

function renderTabs() {
  tabsEl.innerHTML = '';
  Object.keys(subjects).forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (key === state.subject ? ' active' : '');
    btn.textContent = subjects[key].name;
    btn.addEventListener('click', () => switchSubject(key));
    tabsEl.appendChild(btn);
  });
}

function switchSubject(key) {
  state.subject = key;
  state.index = 0;
  state.selected = null;
  state.submitted = false;
  applyTheme(key);
  renderTabs();
  renderCard();
}

function renderDots() {
  dotsEl.innerHTML = '';
  subjects[state.subject].cards.forEach((_, i) => {
    const d = document.createElement('span');
    d.className = 'dot' + (i < state.index ? ' done' : '');
    dotsEl.appendChild(d);
  });
}

function renderCard() {
  shellEl.classList.remove('correct', 'incorrect');
  const set = subjects[state.subject];
  const card = set.cards[state.index];

  labelEl.textContent = set.name.toUpperCase() + ' · CARD ' + (state.index + 1) + ' OF ' + set.cards.length;
  renderDots();
  questionEl.textContent = card.q;
  feedbackEl.textContent = '';
  feedbackEl.className = 'feedback';

  optionsEl.innerHTML = '';
  card.options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'option';
    b.textContent = opt;
    b.addEventListener('click', () => selectOption(opt, b));
    optionsEl.appendChild(b);
  });

  actionBtn.textContent = 'Submit';
  actionBtn.disabled = true;
}

function selectOption(opt, el) {
  if (state.submitted) return;
  state.selected = opt;
  document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  actionBtn.disabled = false;
}

function submitAnswer() {
  const set = subjects[state.subject];
  const card = set.cards[state.index];
  const correct = state.selected === card.answer;
  state.submitted = true;

  document.querySelectorAll('.option').forEach(o => {
    o.disabled = true;
    if (o.textContent === card.answer) o.classList.add('right');
    else if (o.textContent === state.selected) o.classList.add('wrong');
  });

  if (correct) {
    shellEl.classList.add('correct');
    feedbackEl.textContent = 'Well done!';
    feedbackEl.classList.add('good');
  } else {
    shellEl.classList.add('incorrect');
    feedbackEl.textContent = 'Correct answer: ' + card.answer;
    feedbackEl.classList.add('bad');
  }

  actionBtn.textContent = 'Next';
  actionBtn.disabled = false;
}

function nextCard() {
  const set = subjects[state.subject];
  state.index = (state.index + 1) % set.cards.length;
  state.selected = null;
  state.submitted = false;
  renderCard();
}

actionBtn.addEventListener('click', () => {
  if (!state.submitted) submitAnswer();
  else nextCard();
});

// Initialized to open COSC264 by default based on our session
applyTheme(state.subject);
renderTabs();
renderCard();
</script>

</body>
</html>
